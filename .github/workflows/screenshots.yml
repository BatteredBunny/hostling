name: "PR Screenshots"
on:
  pull_request:
    branches: [ main ]
jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Build screenshots
        run: |
          out=$(nix build .#example-screenshots --print-out-paths)
          mkdir -p /tmp/screenshots
          cp "$out"/screenshots/*.png /tmp/screenshots/

      - name: Upload screenshots to Litterbox
        id: upload
        run: |
          upload() {
            local file="$1"
            for attempt in 1 2 3; do
              url=$(curl --max-time 120 -F "reqtype=fileupload" -F "time=72h" \
                -F "fileToUpload=@${file}" \
                https://litterbox.catbox.moe/resources/internals/api.php 2>/dev/null)
              if [[ "$url" == https://litter.catbox.moe/* ]]; then
                echo "$url"
                return 0
              fi
              echo "Attempt $attempt failed for $(basename "$file"), retrying..." >&2
              sleep 5
            done
            echo "Failed to upload $(basename "$file") after 3 attempts" >&2
            return 1
          }

          for img in upload gallery modal admin; do
            url=$(upload "/tmp/screenshots/${img}.png")
            echo "${img}=${url}" >> "$GITHUB_OUTPUT"
          done

      - name: Find existing comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "## Screenshots"

      - name: Post or update PR comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## Screenshots

            Built from ${{ github.event.pull_request.head.sha }}

            | Main page | Library view |
            |:-:|:-:|
            | ![upload](${{ steps.upload.outputs.upload }}) | ![gallery](${{ steps.upload.outputs.gallery }}) |

            | File modal | Admin panel |
            |:-:|:-:|
            | ![modal](${{ steps.upload.outputs.modal }}) | ![admin](${{ steps.upload.outputs.admin }}) |

            <sub>Images expire after 72 hours. Re-run the workflow to regenerate.</sub>
